name: Bug report
description: Report reproducible incorrect behavior that is safe to discuss publicly.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        This issue will be public. Do not include credentials, personal data, private infrastructure details, or unreleased vulnerability information. Use the private security-reporting link for sensitive reports.
  - type: input
    id: route
    attributes:
      label: Affected route or component
      placeholder: /governance or src/api/example.ts
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Observed version
      description: Copy the version from https://demo.wizardgang.ai/version when relevant.
  - type: checkboxes
    id: public-safe
    attributes:
      label: Public-safety confirmation
      options:
        - label: I removed credentials, personal data, private infrastructure details, and sensitive security information.
          required: true
