name: Feature request
description: Propose a new capability or improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: This issue will be public. Describe the problem and desired outcome without including sensitive information.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What is difficult, missing, or unclear today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the capability or result rather than prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: How could a reviewer verify that the outcome works?
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Platform
        - Interfaces
        - Standards and accessibility
        - Delivery and governance
        - Operations
        - AI/MCP
    validations:
      required: true
  - type: checkboxes
    id: public-safe
    attributes:
      label: Public-safety confirmation
      options:
        - label: This request contains no credentials, personal data, or sensitive security information.
          required: true
