name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Full repository check
        run: npm run check
      - name: Apply D1 migrations to a clean local database
        run: npm run validate:migrations
      - name: Audit dependencies
        run: npm run security:dependencies
      - name: Validate Worker build
        run: npm run build
      - name: Validate patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA...HEAD"
      - name: Generate commit-bound validation evidence
        run: npm run evidence
      - uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ github.sha }}
          path: artifacts/evidence/validation.json
          if-no-files-found: error
          retention-days: 30

  change-id:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull-request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^\[DEMO-[0-9]{3,}\] \[(INIT|FEAT|FIX|SEC|API|A11Y|I18N|AI|DB|OPS|TEST|DOCS|REFACTOR|PERF|BUILD|REVERT|CHORE)\] .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::Title must match [DEMO-###] [TYPE] <imperative summary>"
            exit 1
          fi
