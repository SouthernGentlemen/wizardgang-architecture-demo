name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate source, contracts, localization, security, and tests
        run: npm run check
      - name: Apply D1 migrations to a clean local database
        run: npm run validate:migrations
      - name: Audit dependencies
        run: npm run security:dependencies
      - name: Validate Worker build
        run: npm run build
      - name: Generate commit-bound validation evidence
        run: npm run evidence
      - uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ github.sha }}
          path: artifacts/evidence/validation.json
          if-no-files-found: error
          retention-days: 30
