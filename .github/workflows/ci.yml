name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Route validation
        run: npm run validate:routes
      - name: Scaffold validation
        run: npm run validate:scaffold
      - name: History validation
        run: npm run validate:history
      - name: Governance metadata validation
        run: npm run validate:governance
      - name: Public assurance registry validation
        run: npm run validate:assurance
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Contracts
        run: npm run validate:contracts
      - name: Localization
        run: npm run validate:locales
      - name: Security source validation
        run: npm run validate:security
      - name: Apply D1 migrations to a clean local database
        run: npm run validate:migrations
      - name: Audit dependencies
        run: npm run security:dependencies
      - name: Validate Worker build
        run: npm run build
      - name: Generate commit-bound validation evidence
        run: npm run evidence
      - uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ github.sha }}
          path: artifacts/evidence/validation.json
          if-no-files-found: error
          retention-days: 30

  change-id:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull-request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^\[DEMO-[0-9]{3,}\] \[(INIT|FEAT|FIX|SEC|API|A11Y|I18N|AI|DB|OPS|TEST|DOCS|REFACTOR|PERF|BUILD|REVERT|CHORE)\] .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::Title must match [DEMO-###] [TYPE] <imperative summary>"
            exit 1
          fi
