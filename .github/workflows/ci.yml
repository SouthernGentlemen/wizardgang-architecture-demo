name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Run strict CI validation with diagnostics
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_DIAGNOSTICS_DIR: .ci-diagnostics
        run: npm run validate:ci
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-diagnostics
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
  change-id:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull-request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^\[DEMO-[0-9]{3,}\] \[(INIT|FEAT|FIX|SEC|API|A11Y|I18N|AI|DB|OPS|TEST|DOCS|REFACTOR|PERF|BUILD|REVERT|CHORE)\] .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::Title must match [DEMO-###] [TYPE] <imperative summary>"
            exit 1
          fi
