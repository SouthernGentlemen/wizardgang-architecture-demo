name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use committed npm version
        run: npm install --global npm@12.1.0
      - name: Verify pinned Node/npm toolchain
        run: node scripts/validate-toolchain.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Reproduce the tagged state
        run: |
          npm run check
          npm run validate:migrations
          npm run security:dependency-advisories
          npm run build
      - name: Verify annotated semantic release identity
        id: release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be semantic version vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME"
            exit 1
          fi

          tag_ref="refs/tags/$GITHUB_REF_NAME"
          git fetch --force --no-tags origin "$tag_ref:$tag_ref"
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "::error::$GITHUB_REF_NAME is not an annotated tag"
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          checkout_commit="$(git rev-parse HEAD)"
          if [[ "$checkout_commit" != "$tag_commit" ]]; then
            echo "::error::Checked-out commit $checkout_commit does not match tagged commit $tag_commit"
            exit 1
          fi

          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [[ "v$package_version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Package version $package_version does not match release tag $GITHUB_REF_NAME"
            exit 1
          fi

          tag_date="$(TZ=UTC git for-each-ref --format='%(taggerdate:iso8601-strict)' "$tag_ref")"
          previous_tag="$(git describe --tags --abbrev=0 "$tag_commit^" --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"

          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "tag_date=$tag_date" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
      - name: Generate release-bound assurance registry snapshot
        run: |
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p artifacts/assurance
          npm run snapshot:assurance -- \
            --tag "$GITHUB_REF_NAME" \
            --commit "${{ steps.release.outputs.tag_commit }}" \
            --generated-at "$generated_at" \
            --output "artifacts/assurance/registry-$GITHUB_REF_NAME.json"
      - name: Retain assurance registry snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assurance-registry-${{ github.ref_name }}
          path: artifacts/assurance/registry-${{ github.ref_name }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release from tag and GitHub history
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ steps.release.outputs.tag_commit }}
          TAG_DATE: ${{ steps.release.outputs.tag_date }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
        shell: bash
        run: |
          snapshot="artifacts/assurance/registry-$GITHUB_REF_NAME.json"
          previous_display="${PREVIOUS_TAG:-none}"
          release_context="$(printf '## Release identity\n\n- Annotated tag: `%s`\n- Commit: `%s`\n- Annotated tag date (UTC): `%s`\n- Previous release tag: `%s`\n\nRelease changes are generated from GitHub history. The GitHub Release and annotated tag are the historical release authority.\n' "$GITHUB_REF_NAME" "$TAG_COMMIT" "$TAG_DATE" "$previous_display")"

          release_args=(
            "$GITHUB_REF_NAME"
            "$snapshot#Assurance registry snapshot for $GITHUB_REF_NAME"
            --title "WizardGang Architecture Demo $GITHUB_REF_NAME"
            --notes "$release_context"
            --generate-notes
            --verify-tag
          )
          if [[ -n "$PREVIOUS_TAG" ]]; then
            release_args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          gh release create "${release_args[@]}"

  deploy:
    needs: reproduce
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit
