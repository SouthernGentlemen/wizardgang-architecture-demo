name: Assurance Monitor

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use committed npm version
        run: npm install --global npm@12.1.0
      - name: Install locked dependencies
        run: npm ci
      # One suite run against this run's clock: static, freshness and live reporting checks each execute once.
      - name: Validate assurance data, freshness and live reporting paths
        id: assurance
        run: npm run monitor:assurance
      # A cancelled run reaches no tracking-issue transition.
      - name: Maintain assurance monitor tracking issue
        if: ${{ always() && !cancelled() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          MONITOR_STATUS: ${{ job.status }}
          MONITOR_ASSERTIONS: ${{ steps.assurance.outcome }}
          MONITOR_ISSUE_TITLE: Assurance Monitor failure
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = process.env.MONITOR_ISSUE_TITLE;
            const status = process.env.MONITOR_STATUS;
            const assertions = process.env.MONITOR_ASSERTIONS;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const headUrl = `${context.serverUrl}/${owner}/${repo}/commit/${context.sha}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });
            const issue = issues.find((candidate) => !candidate.pull_request && candidate.title === title);

            if (status === 'success') {
              if (issue?.state === 'open') {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `Recovered in ${runUrl} at ${headUrl}.`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
              return;
            }

            const outcome = assertions === 'failure'
              ? 'An assurance assertion failed.'
              : 'The monitor failed before any assurance assertion ran; no assertion was tested.';
            const body = [
              `The Assurance Monitor failed. ${outcome}`,
              '',
              `- Run: ${runUrl}`,
              `- Head: ${headUrl}`,
              `- Event: \`${context.eventName}\``,
              '',
              'Responsible: the Operations Owner, currently the repository owner, or a repair session they authorize; see docs/OPERATIONS.md#assurance-monitor.',
              'Use the Actions run for bounded diagnostic output. Do not copy credentials or secret values into this issue.',
            ].join('\n');

            if (!issue) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
              return;
            }

            if (issue.state === 'closed') {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'open',
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body,
            });
