name: DEMO-159 Source Snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pack source snapshot
        run: tar --exclude=.git -czf /tmp/demo159-source-snapshot.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: demo159-source-snapshot
          path: /tmp/demo159-source-snapshot.tar.gz
          retention-days: 1
          if-no-files-found: error
