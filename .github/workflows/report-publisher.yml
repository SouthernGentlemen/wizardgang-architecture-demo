name: Retained Report Publisher

on:
  workflow_run:
    workflows: [CI, Assurance Monitor]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: retained-report-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted publisher code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate schema-valid report from provider outcomes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          REPORT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/generate-retained-report.mjs "$RUNNER_TEMP/report.json" | tee "$RUNNER_TEMP/report-metadata.json"

      - name: Keep a transient transport copy
        uses: actions/upload-artifact@v4
        with:
          name: retained-report-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish once to durable Git history
        env:
          REPORT_RUN_ID: ${{ github.event.workflow_run.id }}
          REPORT_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REPORT_WORKFLOW: ${{ github.event.workflow_run.name }}
          REPORT_OBSERVED_AT: ${{ github.event.workflow_run.updated_at }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REPORT_WORKFLOW" in
            CI) report_family="ci" ;;
            "Assurance Monitor") report_family="assurance-monitor" ;;
            *) echo "::error::Unapproved report producer"; exit 1 ;;
          esac
          year="${REPORT_OBSERVED_AT:0:4}"
          month="${REPORT_OBSERVED_AT:5:2}"
          target="reports/${year}/${month}/${report_family}-${REPORT_RUN_ID}-attempt-${REPORT_ATTEMPT}.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin assurance-reports >/dev/null 2>&1; then
            git fetch --no-tags origin assurance-reports
            git switch --force-create assurance-reports origin/assurance-reports
          else
            git switch --orphan assurance-reports
            git rm -rf --ignore-unmatch .
            cat > README.md <<'TXT'
          # Retained assurance reports

          This branch is the authoritative durable store for schema-valid internal reports produced by trusted repository workflows. The default branch defines the report contract and retention policy. Transient Actions artifacts are transport copies only.
          TXT
          fi
          mkdir -p "$(dirname "$target")"
          test ! -e "$target" || { echo "::error::Report path already exists: $target"; exit 1; }
          cp "$RUNNER_TEMP/report.json" "$target"
          git add README.md "$target" 2>/dev/null || git add "$target"
          git commit -m "Retain ${REPORT_WORKFLOW} run ${REPORT_RUN_ID} attempt ${REPORT_ATTEMPT}"
          git push origin HEAD:assurance-reports
