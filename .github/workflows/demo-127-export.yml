name: DEMO-127 Workspace Export

on:
  push:
    branches: [demo-127-canonical-normalized-assurance-model]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-artifact@v4
        with:
          name: demo-127-workspace
          path: .
          include-hidden-files: true
          retention-days: 1
