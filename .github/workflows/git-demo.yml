name: Live Git Demo
run-name: Live Git demo · ${{ inputs.operation }} · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Controlled lifecycle operation
        required: true
        type: choice
        options: [start, release]
      bump:
        description: Semantic version component used by start
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      request_id:
        description: Worker-issued correlation identifier
        required: true
        type: string
      pull_request:
        description: Active live-demo pull request used by release
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: live-git-demo-control
  cancel-in-progress: false

jobs:
  start:
    if: inputs.operation == 'start'
    runs-on: ubuntu-latest
    environment: git-demo
    timeout-minutes: 10
    steps:
      - name: Validate controlled inputs
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          BUMP: ${{ inputs.bump }}
        run: |
          if [[ ! "$REQUEST_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::request_id must be a UUID"
            exit 1
          fi
          if [[ ! "$BUMP" =~ ^(patch|minor|major)$ ]]; then
            echo "::error::bump must be patch, minor, or major"
            exit 1
          fi
      - name: Require the wg-github-app configuration
        env:
          APP_ID: ${{ vars.APP_ID }}
          HAS_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY != '' }}
        run: |
          if [[ ! "$APP_ID" =~ ^[1-9][0-9]*$ ]] || [ "$HAS_APP_PRIVATE_KEY" != true ]; then
            echo "::error::The git-demo environment needs the APP_ID variable and the APP_PRIVATE_KEY secret of wg-github-app"
            exit 1
          fi
      - name: Mint a wg-github-app installation token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Refresh current main
        run: |
          git fetch origin main --tags
          git checkout --detach origin/main
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use committed npm version
        run: npm install --global npm@12.1.0
      - name: Enforce one live demo pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          active="$(gh pr list --state open --limit 1000 --json number,headRefName --jq '[.[] | select(.headRefName | test("^demo-[0-9]+-live-v[0-9]+-[0-9]+-[0-9]+-"))][0].number // empty')"
          if [ -n "$active" ]; then
            echo "::error::Live release demonstration already active: PR #$active"
            exit 1
          fi
      - name: Calculate controlled change and version
        id: release
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          REQUEST_ID: ${{ inputs.request_id }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/git-demo-workflow.ts start
      - name: Show release preflight before merge confirmation
        id: preflight
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          last_tag="$(gh release view --json tagName --jq .tagName)"
          if [[ ! "$last_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$(git cat-file -t "refs/tags/$last_tag")" != tag ] || ! git merge-base --is-ancestor "$last_tag" HEAD; then
            echo "::error::No previous semantic release tag is available"
            exit 1
          fi
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"
          git log --format='- %h %s' "$last_tag..HEAD" > "$RUNNER_TEMP/live-release-commits.md"
          {
            echo "### Proposed live release"
            echo "- Target version: v$VERSION"
            echo "- Previous release: $last_tag"
            echo "- Commits since $last_tag:"
            cat "$RUNNER_TEMP/live-release-commits.md"
            echo "- Review the pull request and required CI before Merge & Release confirmation."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create semantic version change
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version
      - name: Commit and push controlled branch
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHANGE_ID: ${{ steps.release.outputs.change_id }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          git config user.name "WizardGang Live Demo"
          git config user.email "live-demo@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add package.json package-lock.json
          git commit -F - <<EOF
          [$CHANGE_ID] [BUILD] Demonstrate v$VERSION release lifecycle

          Change:
          Increment the semantic version to $VERSION for the live release lifecycle.

          Reason:
          Demonstrate the repository's real delivery lifecycle from authenticated /demos#webhooks controls.

          Impact:
          Package version metadata only; release notes are generated from Git/GitHub history after tagging.

          Risk:
          Medium

          Controls:
          - Keep the generated branch isolated until CI and the explicit release gate pass.
          - Keep credentials and tokens in managed secret stores.

          Validation:
          - Pull-request CI runs the repository's complete validation suite.

          Evidence:
          - package.json
          - package-lock.json

          Source:
          Direct live Git demonstration.

          Release:
          v$VERSION

          Live-Release: true
          EOF
          git push --set-upstream origin "$BRANCH"
      - name: Open controlled pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.release.outputs.version }}
          CURRENT_VERSION: ${{ steps.release.outputs.current }}
          CHANGE_ID: ${{ steps.release.outputs.change_id }}
          BRANCH: ${{ steps.release.outputs.branch }}
          REQUEST_ID: ${{ inputs.request_id }}
          BUMP: ${{ inputs.bump }}
          LAST_TAG: ${{ steps.preflight.outputs.last_tag }}
        run: |
          body_file="$(mktemp)"
          {
            echo "## Live Git lifecycle"
            echo
            echo "This controlled pull request was requested from authenticated \`/demos#webhooks\` controls. It remains open so the real CI jobs and review gate can be observed before release."
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Previous version: \`$CURRENT_VERSION\`"
            echo "- Bump: \`$BUMP\`"
            echo "- Previous release: \`$LAST_TAG\`"
            echo "- Commits since $LAST_TAG:"
            cat "$RUNNER_TEMP/live-release-commits.md"
            echo "- Branch: \`$BRANCH\`"
            echo "- Request ID: \`$REQUEST_ID\`"
            echo
            echo "<!-- git-demo-request:$REQUEST_ID -->"
          } > "$body_file"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "[$CHANGE_ID] [BUILD] Demonstrate v$VERSION release lifecycle" \
            --body-file "$body_file"
      - name: Publish start summary
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHANGE_ID: ${{ steps.release.outputs.change_id }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          {
            echo "### Live Git demo started"
            echo "- Change: $CHANGE_ID"
            echo "- Version: v$VERSION"
            echo "- Branch: $BRANCH"
            echo "- Pull request remains open for CI and review."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: inputs.operation == 'release'
    runs-on: ubuntu-latest
    environment: git-demo
    timeout-minutes: 10
    steps:
      - name: Validate controlled inputs
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          if [[ ! "$REQUEST_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || [[ ! "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::release requires a Worker-issued request ID and pull-request number"
            exit 1
          fi
      - name: Require the wg-github-app configuration
        env:
          APP_ID: ${{ vars.APP_ID }}
          HAS_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY != '' }}
        run: |
          if [[ ! "$APP_ID" =~ ^[1-9][0-9]*$ ]] || [ "$HAS_APP_PRIVATE_KEY" != true ]; then
            echo "::error::The git-demo environment needs the APP_ID variable and the APP_PRIVATE_KEY secret of wg-github-app"
            exit 1
          fi
      - name: Mint a wg-github-app installation token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Use committed npm version
        run: npm install --global npm@12.1.0
      - name: Verify the exact live demo pull request
        id: pull
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          pr_json="$(gh pr view "$PULL_REQUEST" --json state,title,body,baseRefName,headRefName,headRefOid)"
          PR_JSON="$pr_json" node scripts/git-demo-workflow.ts verify-pull
      - name: Require successful real CI checks
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          checks="$(gh pr checks "$PULL_REQUEST" --json bucket,name,workflow)"
          CHECKS_JSON="$checks" node scripts/git-demo-workflow.ts require-checks
      - name: Verify reviewed source version
        env:
          BRANCH: ${{ steps.pull.outputs.branch }}
          SHA: ${{ steps.pull.outputs.sha }}
          VERSION: ${{ steps.pull.outputs.version }}
        run: |
          git fetch origin "$BRANCH"
          test "$(git show "$SHA:package.json" | node scripts/git-demo-workflow.ts package-version)" = "$VERSION"
          git show -s --format=%B "$SHA" > "$RUNNER_TEMP/live-release-body.txt"
          grep -qx 'Live-Release: true' "$RUNNER_TEMP/live-release-body.txt"
      - name: Recheck current main and exact PR head
        id: base
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          SHA: ${{ steps.pull.outputs.sha }}
        run: |
          git fetch origin main
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST")"
          PR_JSON="$pr_json" node scripts/git-demo-workflow.ts recheck-base
          echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
      - name: Merge without bypassing repository protections
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          SHA: ${{ steps.pull.outputs.sha }}
          VERSION: ${{ steps.pull.outputs.version }}
        run: |
          title="$(git show -s --format=%s "$SHA")"
          gh pr merge "$PULL_REQUEST" \
            --squash \
            --delete-branch \
            --match-head-commit "$SHA" \
            --subject "$title" \
            --body-file "$RUNNER_TEMP/live-release-body.txt"
      - name: Resolve merged main commit
        id: merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          for attempt in $(seq 1 12); do
            pr_json="$(gh pr view "$PULL_REQUEST" --json state,mergedAt,mergeCommit)"
            merge_sha="$(PR_JSON="$pr_json" node scripts/git-demo-workflow.ts merged-commit)"
            if [ -n "$merge_sha" ]; then
              echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pull request did not reach merged state"
          exit 1
      - name: Hand validated main to the exact-tag cutter
        env:
          VERSION: ${{ steps.pull.outputs.version }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
          SHA: ${{ steps.pull.outputs.sha }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$MERGE_SHA"
          test "$(git show -s --format=%s "$MERGE_SHA")" = "$(git show -s --format=%s "$SHA")"
          test "$(git rev-parse "$MERGE_SHA^")" = "$BASE_SHA"
          test "$(git show "$MERGE_SHA:package.json" | node scripts/git-demo-workflow.ts package-version)" = "$VERSION"
          git show -s --format=%B "$MERGE_SHA" | grep -qx 'Live-Release: true'
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Version tag v$VERSION already exists; the main CI cutter must verify its identity."
          fi
      - name: Publish release summary
        env:
          VERSION: ${{ steps.pull.outputs.version }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          {
            echo "### Live Git demo released"
            echo "- Pull request: #$PULL_REQUEST"
            echo "- Merge commit: $MERGE_SHA"
            echo "- Target tag: v$VERSION"
            echo "- Successful CI on exact current main cuts or verifies the tag and dispatches Release."
          } >> "$GITHUB_STEP_SUMMARY"
