name: Live Git Demo
run-name: Live Git demo · ${{ inputs.operation }} · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Controlled lifecycle operation
        required: true
        type: choice
        options: [start, release]
      bump:
        description: Semantic version component used by start
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      request_id:
        description: Worker-issued correlation identifier
        required: true
        type: string
      pull_request:
        description: Active live-demo pull request used by release
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: live-git-demo-control
  cancel-in-progress: false

jobs:
  start:
    if: inputs.operation == 'start'
    runs-on: ubuntu-latest
    environment: git-demo
    timeout-minutes: 10
    steps:
      - name: Validate controlled inputs
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          BUMP: ${{ inputs.bump }}
        run: |
          if [[ ! "$REQUEST_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::request_id must be a UUID"
            exit 1
          fi
          if [[ ! "$BUMP" =~ ^(patch|minor|major)$ ]]; then
            echo "::error::bump must be patch, minor, or major"
            exit 1
          fi
      - name: Require the wg-github-app configuration
        env:
          APP_ID: ${{ vars.APP_ID }}
          HAS_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY != '' }}
        run: |
          if [[ ! "$APP_ID" =~ ^[1-9][0-9]*$ ]] || [ "$HAS_APP_PRIVATE_KEY" != true ]; then
            echo "::error::The git-demo environment needs the APP_ID variable and the APP_PRIVATE_KEY secret of wg-github-app"
            exit 1
          fi
      - name: Mint a wg-github-app installation token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Refresh current main
        run: |
          git fetch origin main --tags
          git checkout --detach origin/main
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use committed npm version
        run: npm install --global npm@12.1.0
      - name: Enforce one live demo pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          active="$(gh pr list --state open --limit 1000 --json number,headRefName --jq '[.[] | select(.headRefName | test("^demo-[0-9]+-release-v[0-9]+-[0-9]+-[0-9]+-"))][0].number // empty')"
          if [ -n "$active" ]; then
            echo "::error::Live release demonstration already active: PR #$active"
            exit 1
          fi
      - name: Calculate controlled change and version
        id: release
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          REQUEST_ID: ${{ inputs.request_id }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/git-demo-workflow.ts start
      - name: Read the release range since the previous published release
        id: preflight
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          last_tag="$(gh release view --json tagName --jq .tagName)"
          if [[ ! "$last_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$(git cat-file -t "refs/tags/$last_tag")" != tag ] || ! git merge-base --is-ancestor "$last_tag" HEAD; then
            echo "::error::No previous semantic release tag is available"
            exit 1
          fi
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"
          git log --format='- %h %s' "$last_tag..HEAD" > "$RUNNER_TEMP/release-range-commits.md"
      - name: Create semantic version change
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version
      - name: Publish one release-intent record and readiness summary
        id: published
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.release.outputs.version }}
          BUMP: ${{ inputs.bump }}
          REQUEST_ID: ${{ inputs.request_id }}
          LAST_TAG: ${{ steps.preflight.outputs.last_tag }}
          COMMITS_FILE: ${{ runner.temp }}/release-range-commits.md
        run: |
          git config user.name "WizardGang Live Demo"
          git config user.email "live-demo@users.noreply.github.com"
          node scripts/git-demo-workflow.ts publish
      - name: Publish start summary
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHANGE_ID: ${{ steps.published.outputs.change_id }}
          BRANCH: ${{ steps.published.outputs.branch }}
        run: |
          {
            echo "### Live Git demo started"
            echo "- Change: $CHANGE_ID"
            echo "- Version: v$VERSION"
            echo "- Branch: $BRANCH"
            echo "- The release-intent pull request remains open for CI and review."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: inputs.operation == 'release'
    runs-on: ubuntu-latest
    environment: git-demo
    timeout-minutes: 10
    steps:
      - name: Validate controlled inputs
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          if [[ ! "$REQUEST_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || [[ ! "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::release requires a Worker-issued request ID and pull-request number"
            exit 1
          fi
      - name: Require the wg-github-app configuration
        env:
          APP_ID: ${{ vars.APP_ID }}
          HAS_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY != '' }}
        run: |
          if [[ ! "$APP_ID" =~ ^[1-9][0-9]*$ ]] || [ "$HAS_APP_PRIVATE_KEY" != true ]; then
            echo "::error::The git-demo environment needs the APP_ID variable and the APP_PRIVATE_KEY secret of wg-github-app"
            exit 1
          fi
      - name: Mint a wg-github-app installation token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read
          permission-statuses: read
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Use committed npm version
        run: npm install --global npm@12.1.0
      - name: Protected squash through shared delivery path
        id: merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: node scripts/git-demo-workflow.ts merge
      - name: Publish release summary
        env:
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          {
            echo "### Live Git demo released"
            echo "- Pull request: #$PULL_REQUEST"
            echo "- Merge commit: $MERGE_SHA"
            echo "- Successful CI on exact current main with this intent and an empty queue cuts or verifies the tag and dispatches Release."
          } >> "$GITHUB_STEP_SUMMARY"
