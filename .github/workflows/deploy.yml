name: Deploy

on:
  workflow_call:
    inputs:
      ref:
        description: Existing annotated semantic version tag to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Existing semantic version tag to deploy (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify an exact semantic version tag
        id: release
        shell: bash
        run: |
          tag="$(git describe --tags --exact-match HEAD)"
          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Deployment requires an exact semantic version tag; got: $tag" >&2
            exit 1
          fi
          tag_ref="refs/tags/$tag"
          git fetch --force --no-tags origin "$tag_ref:$tag_ref"
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "Deployment requires an annotated tag; got: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies
        run: npm ci
      - name: Validate reviewed tagged source
        run: npm run check
      - name: Verify production Worker secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          secret_names="$RUNNER_TEMP/worker-secret-names.json"
          npx wrangler secret list --json > "$secret_names"
          node scripts/validate-worker-secrets.mjs --provisioned "$secret_names"
      - name: Capture pre-deployment identity baseline
        env:
          IDENTITY_BASELINE_FILE: ${{ runner.temp }}/identity-before.json
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const headers = {
            accept: 'application/json',
            'user-agent': 'Mozilla/5.0 (compatible; WizardGangDeploymentVerifier/1.0; +https://github.com/SouthernGentlemen/wizardgang-architecture-demo)'
          };

          async function fetchJson(url, acceptedStatuses) {
            const response = await fetch(url, { headers, redirect: 'error' });
            const text = await response.text();
            if (!acceptedStatuses.includes(response.status)) throw new Error(`${url} returned HTTP ${response.status}`);
            try {
              return { response, body: JSON.parse(text) };
            } catch {
              throw new Error(`${url} returned non-JSON content`);
            }
          }

          const { body: health } = await fetchJson('https://demo.wizardgang.ai/api/operations/health', [200, 503]);
          const { response: sessionResponse, body: session } = await fetchJson('https://demo.wizardgang.ai/auth/session', [200, 503]);
          const providers = sessionResponse.status === 200 && session.providers && typeof session.providers === 'object'
            ? session.providers
            : {};
          const configuredProviders = Object.entries(providers)
            .filter(([, value]) => value && typeof value === 'object' && value.configured === true)
            .map(([name]) => name)
            .sort();

          const healthIdentity = health.identity;
          const identity = healthIdentity === 'ready' || healthIdentity === 'not-configured'
            ? healthIdentity
            : configuredProviders.length ? 'ready' : 'unknown';

          if (healthIdentity === 'ready' && sessionResponse.status !== 200) {
            throw new Error('Pre-deployment identity surfaces disagree: health is ready but /auth/session is unavailable.');
          }

          fs.writeFileSync(process.env.IDENTITY_BASELINE_FILE, JSON.stringify({ identity, configuredProviders }) + '\n', { mode: 0o600 });
          console.log(`Captured pre-deployment identity baseline: ${identity}; configured providers: ${configuredProviders.join(', ') || 'none'}.`);
          NODE
      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply demo-blob --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy tagged Worker source
        run: >-
          npx wrangler deploy
          --var GITHUB_REPO_URL:https://github.com/SouthernGentlemen/wizardgang-architecture-demo
          --var GITHUB_BRANCH:main
          --var DEPLOYED_VERSION:${{ steps.release.outputs.version }}
          --var DEPLOYED_SHA:${{ steps.release.outputs.sha }}
          --var DEPLOYMENT_ENVIRONMENT:production
          --var DEPLOYMENT_CI_STATUS:passed
          --var BILLING_DEMO_MONTHLY_BUDGET_USD:10
          --var CLOUDFLARE_ACCOUNT_ID:${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          --var CLOUDFLARE_WORKER_NAME:wizardgang-architecture-demo
          --var CLOUDFLARE_D1_DATABASE_ID:4a8ba118-da0e-497b-a13c-911c407a09e3
          --var CLOUDFLARE_R2_BUCKET:wizardgang-demo-r2
          --var CLOUDFLARE_DO_NAMESPACE:${{ vars.CLOUDFLARE_DO_NAMESPACE }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify public version, health, and identity continuity
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
          IDENTITY_BASELINE_FILE: ${{ runner.temp }}/identity-before.json
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const expectedVersion = process.env.EXPECTED_VERSION;
          const expectedSha = process.env.EXPECTED_SHA;
          const baseline = JSON.parse(fs.readFileSync(process.env.IDENTITY_BASELINE_FILE, 'utf8'));

          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          const headers = {
            accept: 'application/json',
            'user-agent': 'Mozilla/5.0 (compatible; WizardGangDeploymentVerifier/1.0; +https://github.com/SouthernGentlemen/wizardgang-architecture-demo)'
          };

          async function fetchJsonWithRetry(url, acceptedStatuses) {
            const attempts = 24;
            let lastFailure = 'no response';

            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetch(url, { headers, redirect: 'error' });
                const bodyText = await response.text();
                lastFailure = `HTTP ${response.status}`;

                if (acceptedStatuses.includes(response.status)) {
                  try {
                    return { response, body: JSON.parse(bodyText) };
                  } catch {
                    lastFailure = `HTTP ${response.status} with a non-JSON response`;
                  }
                }
              } catch (error) {
                lastFailure = error instanceof Error ? error.message : String(error);
              }

              console.log(`Attempt ${attempt}/${attempts} for ${url} failed: ${lastFailure}`);
              if (attempt < attempts) await sleep(5_000);
            }

            throw new Error(`${url} did not become verifiable: ${lastFailure}`);
          }

          const { body: metadata } = await fetchJsonWithRetry(
            'https://demo.wizardgang.ai/api/operations/version',
            [200]
          );
          if (metadata.version !== expectedVersion || metadata.commit !== expectedSha) {
            throw new Error(`Version mismatch: ${JSON.stringify(metadata)}`);
          }

          const { response: health, body } = await fetchJsonWithRetry(
            'https://demo.wizardgang.ai/api/operations/health',
            [200, 503]
          );
          if (body.services?.worker !== 'operational') {
            throw new Error(`Health verification failed: ${health.status} ${JSON.stringify(body)}`);
          }
          if (!['ready', 'not-configured'].includes(body.identity)) {
            throw new Error('Health verification did not return the DEMO-296 identity readiness value.');
          }
          if (baseline.identity === 'ready' && body.identity !== 'ready') {
            throw new Error(`Identity readiness regressed from ready to ${body.identity}.`);
          }

          const { response: identitySessionResponse, body: identitySession } = await fetchJsonWithRetry(
            'https://demo.wizardgang.ai/auth/session',
            [200, 503]
          );
          const previouslyConfigured = Array.isArray(baseline.configuredProviders) ? baseline.configuredProviders : [];
          if (previouslyConfigured.length && identitySessionResponse.status !== 200) {
            throw new Error(`Identity provider continuity failed: /auth/session returned HTTP ${identitySessionResponse.status}.`);
          }
          const afterProviders = identitySession?.providers && typeof identitySession.providers === 'object'
            ? identitySession.providers
            : {};
          const regressedProviders = previouslyConfigured.filter((name) => afterProviders[name]?.configured !== true);
          if (regressedProviders.length) {
            throw new Error(`Identity provider configuration regressed: ${regressedProviders.join(', ')}.`);
          }

          console.log(`Verified ${metadata.version} (${metadata.commit}) with Worker status ${body.services.worker}, identity ${body.identity}, and provider continuity for ${previouslyConfigured.join(', ') || 'none'}.`);
          NODE
